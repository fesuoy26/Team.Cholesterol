<style>
:root{--bg:#0b100e;--card:#141c18;--card2:#1b2620;--ink:#f5f8f4;--muted:#aab7ae;--line:#29372e;--lime:#c8ff3d;--green:#c8ff3d;--green2:#c8ff3d;--gold:#ffb347;--red:#ff6b5e;--redbg:#ff6b5e1c;--ok:#c8ff3d;--okbg:#c8ff3d18;--grey:#1b2620;--adm:#ffb3471a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Anek Malayalam',sans-serif;font-size:16px}
button,input,select,textarea,option,table,th,td,summary{font-family:'Anek Malayalam',sans-serif;font-size:inherit;color:inherit}button,input,select,textarea{font-size:16px}
.hero{position:relative;overflow:hidden;padding:22px 16px 64px;background:radial-gradient(ellipse at 85% 30%,#39532b 0%,#17241b 30%,#0b100e 72%);border-bottom:1px solid #ffffff12}
.hero:after{content:"";position:absolute;right:-120px;top:-40px;width:340px;height:340px;border:1px solid #c8ff3d35;border-radius:50%;box-shadow:0 0 0 34px #c8ff3d08,0 0 0 74px #c8ff3d05;pointer-events:none}
.hero:before{content:"";position:absolute;left:-30px;bottom:-60px;width:62%;height:120px;border:2px solid #c8ff3d30;transform:skewY(-8deg) rotate(-4deg);pointer-events:none;background:linear-gradient(#c8ff3d30,#c8ff3d30) center/2px 100% no-repeat}
.eyebrow{display:inline-flex;gap:8px;align-items:center;color:var(--lime);font-weight:800;font-size:11px;letter-spacing:.17em;text-transform:uppercase;position:relative;z-index:1}
.eyebrow i{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 12px var(--lime)}
.hero h1{margin:8px 0 2px;font-size:34px;font-weight:800;line-height:.95;letter-spacing:-.02em;text-transform:uppercase;position:relative;z-index:1}
.hero h1 span{color:var(--lime)}
.hero .sub{color:#c0cbc2;font-size:13px;position:relative;z-index:1}
.logo{position:absolute;right:16px;top:18px;width:86px;height:86px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #c8ff3d55,0 8px 24px rgba(0,0,0,.5);z-index:3;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero h1,.hero .sub{padding-right:100px}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#ffffff0d;border:1px solid #ffffff1a;padding:4px 11px;border-radius:20px;font-size:12px;position:relative;z-index:1;cursor:pointer;color:#d5ded7}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}.dot.warn{background:var(--gold);box-shadow:none}.dot.err{background:var(--red);box-shadow:none}
main{padding:12px 12px 100px;position:relative;z-index:2;max-width:760px;margin-left:auto;margin-right:auto}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#0b100ee6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff12}
.menuBtn{border:1px solid var(--line);background:var(--card2);color:var(--lime);width:40px;height:40px;border-radius:12px;font-size:20px;flex:none}
.tlogo{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #c8ff3d55;flex:none;cursor:pointer}
.ttl{flex:1;min-width:0;line-height:1.05;cursor:pointer}.ttl b{font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}.ttl b span{color:var(--lime)}.ttl small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.topbar .sync{margin:0;flex:none;max-width:44%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media(max-width:600px){.topbar .sync{padding:8px;max-width:none}.topbar .sync #syncTxt{display:none}.ttl b{font-size:15px}}
.scrim{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:.25s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:84vw;background:linear-gradient(180deg,#141c18,#0b100e);border-right:1px solid var(--line);z-index:45;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.drawer.on{transform:none;box-shadow:20px 0 50px #000a}
.dhead{display:flex;gap:12px;align-items:center;padding:20px 16px 16px;border-bottom:1px solid var(--line)}.dhead img{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #c8ff3d44}
.dhead b{font-weight:800;letter-spacing:.04em;font-size:17px;line-height:1}.dhead b span{color:var(--lime);display:block}.dhead small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
#drawerNav{flex:1;overflow:auto;padding:10px}
.dnav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#d5ded7;padding:12px 12px;border-radius:12px;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.dnav i{font-style:normal;width:24px;text-align:center}.dnav:hover{background:#ffffff08}.dnav.on{background:#c8ff3d18;color:var(--lime)}
.dsub{padding-left:46px;font-size:13.5px;font-weight:600;padding-top:8px;padding-bottom:8px;color:var(--muted)}
.dsec{color:#7e8d82;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:14px 12px 4px}
.dfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.landing{position:relative;margin:-12px -12px 14px;min-height:78vh;background-size:cover;background-position:62% center;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 18px 22px}
.landing:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060b12f2 0%,#060b12c0 45%,#060b1222 100%),linear-gradient(0deg,#0b100e 0%,#0b100e00 45%)}
.landing .wm{position:absolute;right:-60px;top:6%;width:min(78vw,520px);opacity:.09;pointer-events:none;filter:saturate(.8);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.landing>*{position:relative}
.landing h1{font-size:clamp(44px,13vw,86px);line-height:.9;letter-spacing:-.03em;margin:12px 0 12px;font-weight:800;text-transform:uppercase}
.landing h1 span{color:var(--lime)}
.landing p{color:#c0cbc2;max-width:460px;line-height:1.55;margin:0 0 18px}
.lstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px}
.lstat{background:#ffffff0d;border:1px solid #ffffff1a;backdrop-filter:blur(6px);border-radius:14px;padding:12px}.lstat b{display:block;font-size:24px;color:var(--lime);line-height:1.1}.lstat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.qcard i{font-style:normal;font-size:26px}.qcard b{display:block;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;font-size:14px}.qcard small{color:var(--muted);font-size:12px}
.qcard:after{content:"↗";position:absolute;right:14px;top:12px;color:var(--lime);font-weight:800}
@media(min-width:560px){.lstats{grid-template-columns:repeat(4,1fr)}.qgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.drawer{transform:none;box-shadow:none}.scrim{display:none}.menuBtn,.tlogo{display:none!important}body{padding-left:280px}.tabs{display:none!important}main{padding-bottom:40px;max-width:900px}.fab{bottom:24px}.landing{margin:-12px -12px 16px;border-radius:0 0 24px 24px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#ffffff08;border:1px solid #ffffff12;border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:22px;color:var(--lime)}.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi.red b{color:var(--red)}.kpi.ok b{color:var(--lime)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #ffffff0c;cursor:pointer}.row:last-child{border-bottom:0}
.row .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn{width:28px;height:28px;border-radius:9px;background:var(--card2);border:1px solid #40533d;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--lime);flex:none}
.pill{padding:4px 10px;border-radius:30px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pill.due{background:var(--redbg);color:var(--red)}.pill.cr{background:var(--okbg);color:var(--lime)}.pill.cl{background:#ffffff0d;color:var(--muted)}
.pill.warn{background:#ffb34722;color:var(--gold)}.pill.g{background:#7fb8ff22;color:#9cc8ff}
.muted{color:var(--muted);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0b100ef2;backdrop-filter:blur(8px);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:9.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#7e8d82;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs button i{font-style:normal;font-size:19px;filter:grayscale(.6)}.tabs button.on{color:var(--lime)}.tabs button.on i{filter:none}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;font-size:14px;letter-spacing:.02em;background:var(--lime);color:#11190f;cursor:pointer}
.btn.sec{background:transparent;border:1px solid #9db18e;color:var(--ink)}.btn.gold{background:var(--lime);color:#11190f}.btn.red{background:var(--redbg);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:80px;z-index:21;border-radius:30px;box-shadow:0 0 0 4px #c8ff3d22,0 8px 22px rgba(0,0,0,.5)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.x{border:1px solid var(--line);background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--ink)}
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 4px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--lime)}
input[type=date]{color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--lime);color:#11190f;border-color:var(--lime);font-weight:800}
.chip.q{padding:4px 9px;font-size:13px}
.payrow{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0c}
.payrow .q{grid-column:1/3;display:flex;gap:5px;flex-wrap:wrap}
.payrow input{padding:8px;text-align:right;font-weight:800}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--muted)}.seg button.on{background:var(--lime);color:#11190f;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;border-bottom:1px solid #ffffff0c;text-align:left}th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}td.n,th.n{text-align:right}
table.mt{font-size:12.5px;table-layout:fixed}table.mt td,table.mt th{padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}table.mt col.c1{width:22px}table.mt col.c3,table.mt col.c5,table.mt col.c6{width:44px}table.mt col.c4{width:40px}table.mt col.c7{width:52px}
.month{font-size:11px;font-weight:800;color:var(--lime);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.16em}
.score{font-weight:800;font-size:15px}.win{color:var(--lime)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--lime);color:#11190f;font-weight:700;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%}
.help li{margin-bottom:6px;font-size:14px;color:#d5ded7}
.search{margin-bottom:8px}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 0 8px}
.crest{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#29392c,#172019);border:1px solid #40533d;display:grid;place-items:center;margin:0 auto 8px;color:var(--lime);font-weight:900;font-size:17px}
</style>

const LS_DATA='tc_data_v2', LS_DIRTY='tc_dirty_v2', LS_PIN='tc_pin_v2', LS_API='tc_api_v2', LS_STAMP='tc_stamp_v2', LS_ROLE='tc_role_v2';
let D=null, tab='home', dirty=localStorage.getItem(LS_DIRTY)==='1', syncing=false, CFG={apiUrl:''};
let adminPin=localStorage.getItem(LS_PIN)||'', serverStamp=localStorage.getItem(LS_STAMP)||'';
let role=localStorage.getItem(LS_ROLE)||(adminPin?'admin':'');
const isAdmin=()=>role==='admin';
const apiUrl=()=>localStorage.getItem(LS_API)||CFG.apiUrl||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date(Date.now()+3*3600e3);return d.toISOString().slice(0,10)}; // KSA
const fd=(s,o={weekday:'short',day:'numeric',month:'short'})=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',o):'';
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const P=id=>D.players.find(p=>p.id===id);
const pname=id=>(P(id)||{name:'?'}).name;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};

/* ---------- ACCOUNTING ----------
 balance(p) = opening + cash p paid + court/shuttle p paid for the team - cash p received from others - fee for every session p played
 Minus = owes the team, Plus = team owes him. Admin: Plus = spent extra, Minus = holding team cash.
 Team fund = opening fund + fees charged - court/shuttle cost.  Check: sum(balances)+fund+pending court = 0 */
function compute(asOf){
  asOf=asOf||'9999-12-31';
  const st={};D.players.forEach(p=>st[p.id]={bal:+p.opening||0,played:0,fees:0,paid:0,spent:0,received:0});
  let fees=0,cost=0,pending=0,pendingList=[];
  D.sessions.filter(s=>s.date<=asOf).forEach(s=>{
    s.attendance.forEach(id=>{if(!st[id])return;st[id].bal-=+s.fee;st[id].played++;st[id].fees+=+s.fee;fees+=+s.fee});
    const ex=(+s.court||0)+(+s.shuttle||0);cost+=ex;
    if(s.courtPaidOn&&s.courtPaidOn<=asOf&&s.paidBy&&st[s.paidBy]){st[s.paidBy].bal+=ex;st[s.paidBy].spent+=ex}
    else if(ex){pending+=ex;pendingList.push(s)}
  });
  D.payments.filter(x=>x.date<=asOf).forEach(x=>{
    const a=+x.amount||0;if(st[x.playerId]){st[x.playerId].bal+=a;st[x.playerId].paid+=a}
    const r=x.receivedBy||D.adminId;if(st[r]){st[r].bal-=a;st[r].received+=a}
  });
  const fund=(+D.openingFund||0)+fees-cost;
  const sum=Object.values(st).reduce((a,b)=>a+b.bal,0);
  return {st,fund,pending,pendingList,fees,cost,check:Math.round((sum+fund+pending)*100)/100};
}
function ledger(id){
  const p=P(id);const rows=[];
  D.sessions.forEach(s=>{
    if(s.attendance.includes(id))rows.push({d:s.date,t:`Played · fee`,a:-s.fee});
    const ex=(+s.court||0)+(+s.shuttle||0);
    if(s.paidBy===id&&s.courtPaidOn&&ex)rows.push({d:s.courtPaidOn,t:`Paid court/shuttle for ${fd(s.date,{day:'numeric',month:'short'})}`,a:ex});
  });
  D.payments.forEach(x=>{
    if(x.playerId===id)rows.push({d:x.date,t:'Paid'+(x.note?` · ${x.note}`:''),a:+x.amount});
    if((x.receivedBy||D.adminId)===id&&x.playerId!==id)rows.push({d:x.date,t:`Collected from ${pname(x.playerId)}`,a:-x.amount});
  });

function weekStart(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-x.getDay());return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')} // week starts Sunday (KSA)
function matchResult(m){let a=0,b=0,pa=0,pb=0;m.games.forEach(g=>{if(g[0]===''||g[1]==='')return;pa+=+g[0];pb+=+g[1];+g[0]>+g[1]?a++:+g[1]>+g[0]?b++:0});return{a,b,pa,pb,w:a>b?'a':b>a?'b':''}}
function vMatches(){
  const tbl={};D.matches.forEach(m=>{const r=matchResult(m);[['a',m.a],['b',m.b]].forEach(([side,ids])=>ids.forEach(id=>{const t=tbl[id]=tbl[id]||{p:0,w:0,diff:0};t.p++;if(r.w===side)t.w++;t.diff+=side==='a'?r.pa-r.pb:r.pb-r.pa}))});
  const lb=Object.entries(tbl).sort((x,y)=>y[1].w-x[1].w||(y[1].w/y[1].p)-(x[1].w/x[1].p)||y[1].diff-x[1].diff);
  const ms=[...D.matches].sort((a,b)=>a.date<b.date?1:-1);let html='',wk='';
  html+=`<div class="card"><h2>🏆 Leaderboard</h2>${lb.length?`<table><tr><th>#</th><th>Player</th><th class="n">P</th><th class="n">W</th><th class="n">Win%</th><th class="n">+/-</th></tr>${lb.map(([id,t],i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(pname(id))}</td><td class="n">${t.p}</td><td class="n"><b>${t.w}</b></td><td class="n">${Math.round(t.w/t.p*100)}%</td><td class="n">${t.diff>0?'+':''}${t.diff}</td></tr>`).join('')}</table>`:'<div class="muted">No matches recorded yet.'+(isAdmin()?' Tap ＋ Match to add the first one.':'')+'</div>'}</div><div class="card">`;
  ms.forEach(m=>{const w=weekStart(m.date);if(w!==wk){html+=`<div class="month">Week of ${fd(w,{day:'numeric',month:'short'})}</div>`;wk=w}
    const r=matchResult(m);
    html+=`<div class="row" ${isAdmin()?`onclick="editMatch('${m.id}')"`:''}><div style="flex:1"><div class="${r.w==='a'?'win':''}"><b>${m.a.map(pname).map(esc).join(' & ')}</b></div><div class="${r.w==='b'?'win':''}"><b>${m.b.map(pname).map(esc).join(' & ')}</b></div><div class="muted">${fd(m.date)} · ${m.format}${m.note?' · '+esc(m.note):''}</div></div>
    <div class="score">${m.games.filter(g=>g[0]!=='').map(g=>`${g[0]}-${g[1]}`).join('<br>')}</div></div>`});
  $('#view').innerHTML=html+(ms.length?'':'')+'</div>';
}
function editMatch(id){
  const m=id?JSON.parse(JSON.stringify(D.matches.find(x=>x.id===id))):{id:uid('m'),date:today(),format:'doubles',a:[],b:[],games:[['',''],['',''],['','']],note:''};
  while(m.games.length<3)m.games.push(['','']);window._M=m;drawMatch(!id);
}
function drawMatch(isNew){
  const m=_M,n=m.format==='doubles'?2:1;const act=D.players.filter(p=>p.active).sort((a,b)=>a.sn-b.sn);
  const pick=side=>`<div class="chips">${act.map(p=>`<span class="chip ${m[side].includes(p.id)?'on':''}" onclick="pickM('${side}','${p.id}',${isNew})">${esc(p.name)}</span>`).join('')}</div>`;
  modal(`<h3>🏸 ${isNew?'New':'Edit'} match<button class="x" onclick="closeModal()">✕</button></h3>
  <div class="grid2"><div><label>Date</label><input type="date" value="${m.date}" onchange="_M.date=this.value"></div><div><label>Format</label><div class="seg"><button class="${n===2?'on':''}" onclick="_M.format='doubles';_M.a=_M.a.slice(0,2);_M.b=_M.b.slice(0,2);drawMatch(${isNew})">Doubles</button><button class="${n===1?'on':''}" onclick="_M.format='singles';_M.a=_M.a.slice(0,1);_M.b=_M.b.slice(0,1);drawMatch(${isNew})">Singles</button></div></div></div>
  <label>Team A (${m.a.length}/${n})</label>${pick('a')}<label>Team B (${m.b.length}/${n})</label>${pick('b')}
  <label>Game scores (A – B)</label>${m.games.map((g,i)=>`<div class="grid3" style="margin-bottom:6px;align-items:center"><span class="muted">Game ${i+1}</span><input type="number" inputmode="numeric" value="${g[0]}" oninput="_M.games[${i}][0]=this.value"><input type="number" inputmode="numeric" value="${g[1]}" oninput="_M.games[${i}][1]=this.value"></div>`).join('')}

}
function pickM(side,id,isNew){const m=_M,n=m.format==='doubles'?2:1,o=side==='a'?'b':'a';m[o]=m[o].filter(x=>x!==id);const i=m[side].indexOf(id);if(i>=0)m[side].splice(i,1);else{m[side].push(id);if(m[side].length>n)m[side].shift()}drawMatch(isNew)}
function saveMatch(){const m=_M;const n=m.format==='doubles'?2:1;if(m.a.length!==n||m.b.length!==n)return toast(`Select ${n} player(s) per team`);
  m.games=m.games.filter(g=>g[0]!==''&&g[1]!=='').map(g=>[+g[0],+g[1]]);if(!m.games.length)return toast('Enter at least one game score');
  const i=D.matches.findIndex(x=>x.id===m.id);i<0?D.matches.push(m):D.matches[i]=m;closeModal();commit('Match '+m.date)}

/* ---------- LOGO / WATERMARK ---------- */
let _logo=null;
function logoImg(){if(_logo)return _logo;_logo=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGO});return _logo}
async function stampLogo(x,W,H,headerH){
  const L=await logoImg();if(!L)return;
  // header badge (top-right)
  const s=Math.min(170,headerH-50),bx=W-s-34,by=(headerH-20-s)/2+4;
  x.save();x.fillStyle='#fff';x.beginPath();x.arc(bx+s/2,by+s/2,s/2+6,0,Math.PI*2);x.fill();x.drawImage(L,bx,by,s,s);x.restore();
  // centred watermark over the body
  const ws=Math.min(W*0.78,H-headerH-80),wx=(W-ws)/2,wy=headerH+(H-headerH-ws)/2;
  x.save();x.globalAlpha=0.08;x.drawImage(L,wx,wy,ws,ws);x.restore();
}
async function showImage(cv,name,title){
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],name,{type:'image/png'}),url=URL.createObjectURL(blob);
  modal(`<h3>📸 ${esc(title)}<button class="x" onclick="closeModal()">✕</button></h3><img src="${url}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
  <div class="btns" style="margin-top:12px"><button class="btn" id="shBtn">📲 Share to WhatsApp</button><a class="btn sec" style="text-decoration:none" href="${url}" download="${name}">⬇️ Download</a></div>

const CATS=['Advanced','Intermediate','Beginners'];
const DEF_RULES={target:21,deuce:false,cap:30,bestOf:3};

const canScore=()=>role==='admin'||role==='scorer';
function newTournament(){
  const clubs=[{id:'tc',name:'Team Cholesterol',short:'TC'},{id:'tw',name:'Tamil Warriors',short:'TW'}];

    clubs.forEach(c=>[1,2].forEach(n=>teams.push({id:`${c.id}-${k}${n}`,club:c.id,cat,name:`${c.short} ${cat} ${n}`,p1:'',p2:''})));
    [1,2].forEach(n=>fixtures.push({id:`f-${k}${n}`,cat,t1:`tc-${k}${n}`,t2:`tw-${k}${n}`,time:'',court:'',games:[],wo:'',status:'scheduled',live:null,rules:null,ts:0}));
  });

}
function TT(){
  if(!D.tournaments||!D.tournaments.length){D.tournaments=[newTournament()];
    if(canScore()&&window._serverTourCount===0){window._serverTourCount=1;tourOp('replace',D.tournaments[0])}}
  const T=D.tournaments[0];T.scoring=T.scoring||{...DEF_RULES};return T;
}
const tTeam=(T,id)=>T.teams.find(t=>t.id===id)||{id,name:'?',club:'',p1:'',p2:''};
const tClub=(T,id)=>T.clubs.find(c=>c.id===id)||{name:'?',short:'?'};

const rulesTxt=R=>R.target===30&&R.bestOf===1&&!R.deuce?'30 pts direct':`${R.target} pts${R.deuce?' (deuce, max '+R.cap+')':''} · ${R.bestOf===1?'1 game':'best of '+R.bestOf}`;
function gameWinner(a,b,R){
  if(R.deuce){if((a>=R.target||b>=R.target)&&Math.abs(a-b)>=2)return a>b?1:2;if(a>=R.cap)return 1;if(b>=R.cap)return 2;return 0}
  if(a>=R.target)return 1;if(b>=R.target)return 2;return 0;
}
function fxResult(f){
  let a=0,b=0,pa=0,pb=0;(f.games||[]).forEach(g=>{if(g[0]===''||g[0]==null)return;pa+=+g[0];pb+=+g[1];+g[0]>+g[1]?a++:+g[1]>+g[0]?b++:0});
  let w='';if(f.wo)w=f.wo;else if(f.status==='done'||(!f.status&&(f.games||[]).length))w=a>b?'t1':b>a?'t2':'';
  return {a,b,pa,pb,w,done:!!w,live:f.status==='live'&&!f.wo};
}
function tStandings(T){
  const st={};T.teams.forEach(t=>st[t.id]={t,p:0,w:0,l:0,gd:0,pd:0,pts:0});
  T.fixtures.forEach(f=>{const r=fxResult(f);if(!r.done||!st[f.t1]||!st[f.t2])return;
    const A=st[f.t1],B=st[f.t2];A.p++;B.p++;A.gd+=r.a-r.b;B.gd+=r.b-r.a;A.pd+=r.pa-r.pb;B.pd+=r.pb-r.pa;
    if(r.w==='t1'){A.w++;B.l++;A.pts+=+T.winPts;B.pts+=+T.lossPts}else{B.w++;A.l++;B.pts+=+T.winPts;A.pts+=+T.lossPts}});
  const cats=CATS.map(cat=>{
    const cl=T.clubs.map(c=>{const ts=T.teams.filter(t=>t.cat===cat&&t.club===c.id).map(t=>st[t.id]);
      return {c,pts:ts.reduce((s,x)=>s+x.pts,0),gd:ts.reduce((s,x)=>s+x.gd,0),pd:ts.reduce((s,x)=>s+x.pd,0)}});
    const fx=T.fixtures.filter(f=>f.cat===cat),done=fx.filter(f=>fxResult(f).done).length;
    const [x,y]=cl;let lead=null;
    if(x.pts!==y.pts)lead=x.pts>y.pts?x:y;else if(x.gd!==y.gd)lead=x.gd>y.gd?x:y;else if(x.pd!==y.pd)lead=x.pd>y.pd?x:y;
    const tb=!!lead&&x.pts===y.pts;
    return {cat,tb,clubs:cl,teams:T.teams.filter(t=>t.cat===cat).map(t=>st[t.id]).sort((p,q)=>q.pts-p.pts||q.gd-p.gd||q.pd-p.pd),fx,done,complete:fx.length>0&&done===fx.length,lead,started:done>0};
  });
  const overall=T.clubs.map(c=>({c,pts:cats.reduce((s,k)=>s+k.clubs.find(z=>z.c.id===c.id).pts,0),cw:cats.filter(k=>k.complete&&k.lead&&k.lead.c.id===c.id).length,
    gd:cats.reduce((s,k)=>s+k.clubs.find(z=>z.c.id===c.id).gd,0),pd:cats.reduce((s,k)=>s+k.clubs.find(z=>z.c.id===c.id).pd,0)}));
  const [o1,o2]=overall;let olead=null;
  if(o1.pts!==o2.pts)olead=o1.pts>o2.pts?o1:o2;else if(o1.cw!==o2.cw)olead=o1.cw>o2.cw?o1:o2;else if(o1.gd!==o2.gd)olead=o1.gd>o2.gd?o1:o2;else if(o1.pd!==o2.pd)olead=o1.pd>o2.pd?o1:o2;
  const all=T.fixtures.length,doneAll=T.fixtures.filter(f=>fxResult(f).done).length,liveN=T.fixtures.filter(f=>fxResult(f).live).length;
  return {cats,overall,olead,complete:all>0&&doneAll===all,doneAll,all,liveN};
}
const scoreTxt=f=>{if(f.wo)return 'W/O';return (f.games||[]).filter(g=>g[0]!==''&&g[0]!=null).map(g=>`${g[0]}-${g[1]}`).join(', ')};

function sendFixture(f){

  fxTimers[f.id]=setTimeout(()=>{fxTimers[f.id]=null;const cur=TT().fixtures.find(x=>x.id===f.id);if(cur)tourOp('fixture',JSON.parse(JSON.stringify(cur)))},400);

function mergeTour(S){
  if(!S)return false;const before=JSON.stringify(D.tournaments[0]||null);
  const L=D.tournaments&&D.tournaments[0];
  if(!L||L.id!==S.id){D.tournaments=[S];saveLocal();return true}
  const busy=id=>!!fxTimers[id];
  const fx=S.fixtures.map(sf=>{const lf=L.fixtures.find(x=>x.id===sf.id);return lf&&(busy(lf.id)||(lf.ts||0)>(sf.ts||0))?lf:sf});
  L.fixtures.forEach(lf=>{if(!S.fixtures.some(x=>x.id===lf.id)&&busy(lf.id))fx.push(lf)});
  D.tournaments[0]={...S,fixtures:fx};saveLocal();

}

function tourStats(T){

  const pl={};const addP=(n,club,w,pf,pa)=>{if(!n)return;const k=n.toUpperCase();const o=pl[k]=pl[k]||{n,club,p:0,w:0,pd:0};o.p++;if(w)o.w++;o.pd+=pf-pa};
  let games=0,points=0,closest=null,biggest=null;
  done.forEach(({f,r})=>{const A=tTeam(T,f.t1),B=tTeam(T,f.t2),ca=club[A.club],cb=club[B.club];
    games+=(f.games||[]).length;points+=r.pa+r.pb;
    if(ca){ca.p++;ca.gw+=r.a;ca.gl+=r.b;ca.pf+=r.pa;ca.pa+=r.pb;if(r.w==='t1'){ca.w++;ca.pts+=+T.winPts}else{ca.l++;ca.pts+=+T.lossPts}}
    if(cb){cb.p++;cb.gw+=r.b;cb.gl+=r.a;cb.pf+=r.pb;cb.pa+=r.pa;if(r.w==='t2'){cb.w++;cb.pts+=+T.winPts}else{cb.l++;cb.pts+=+T.lossPts}}
    [A.p1,A.p2].forEach(n=>addP(n,A.club,r.w==='t1',r.pa,r.pb));[B.p1,B.p2].forEach(n=>addP(n,B.club,r.w==='t2',r.pb,r.pa));
    if(!f.wo&&(f.games||[]).length){const m=Math.abs(r.pa-r.pb),o={f,m,A,B,r};if(!closest||m<closest.m)closest=o;if(!biggest||m>biggest.m)biggest=o}});
  const players=Object.values(pl).sort((a,b)=>b.w-a.w||b.pd-a.pd);
  return {S,done,live,up,club:Object.values(club),players,games,points,closest,biggest};
}

/* --- one match: live scoreboard (everyone) + scoring controls (admin / scorer) --- */
function openFixture(id,refresh){
  const T=TT(),f=T.fixtures.find(x=>x.id===id);if(!f){closeModal();return}
  window._openFx=id;const A=tTeam(T,f.t1),B=tTeam(T,f.t2),R=rulesOf(f,T),r=fxResult(f),sc=canScore();
  const gA=r.a,gB=r.b,L=f.live||{a:0,b:0};
  const gp=side=>r.live&&gameWinner(side===1?L.a+1:L.a,side===2?L.b+1:L.b,R)===side;
  const side=(t,n,pts,games,col)=>`<div style="text-align:center;flex:1;min-width:0">
     <div style="font-weight:800;font-size:15px;text-transform:uppercase;color:${col}">${esc(t.name)}</div>

     ${sc&&!refresh?'':''}
     <div style="font-size:${r.live?72:44}px;font-weight:800;line-height:1;margin:6px 0;color:${col}">${r.live?pts:games}</div>
     <div class="muted">${r.live?`Games ${games}`:'games'}</div>

     ${sc&&r.live?`<button class="btn" style="width:100%;margin-top:10px;padding:22px 0;font-size:26px;${n===2?'background:#9cc8ff':''}" onclick="addPoint('${id}',${n})">＋1</button>`:''}
     ${sc?`<button class="btn sec sm" style="margin-top:8px" onclick="editTeam('${t.id}')">✏️ Name / players</button>`:''}</div>`;
  let body=`<h3>${f.cat} match <span>${r.live?'<span class="pill due">● LIVE</span> ':''}<button class="x" onclick="closeFixture()">✕</button></span></h3>
   <div class="muted" style="text-align:center;margin-bottom:8px">${esc(rulesTxt(R))}${f.time?' · 🕒 '+esc(f.time):''}${f.court?' · Court '+esc(f.court):''}${r.live?` · Game ${(f.games||[]).length+1}`:''}</div>
   <div style="display:flex;gap:10px;align-items:flex-start">${side(A,1,L.a,gA,'var(--lime)')}<div style="padding-top:60px;font-weight:900;color:#7e8d82">VS</div>${side(B,2,L.b,gB,'#9cc8ff')}</div>
   ${(f.games||[]).length?`<div style="margin-top:12px;text-align:center">${f.games.map((g,i)=>`<span class="pill cl" style="margin:2px;display:inline-block">G${i+1} ${g[0]}-${g[1]}</span>`).join('')}</div>`:''}
   ${r.done?`<div class="pill cr" style="display:block;text-align:center;margin-top:12px;font-size:15px">🏆 ${esc(r.w==='t1'?A.name:B.name)} wins${f.wo?' (walkover)':''} · +${T.winPts} pts</div>`:''}`;
  if(sc){
    if(r.live){
      body+=`<div class="btns" style="margin-top:14px;justify-content:center"><button class="btn sec" onclick="undoPoint('${id}')">↶ Undo</button><button class="btn sec" onclick="minusPoint('${id}',1)">−1 ${esc(A.name)}</button><button class="btn sec" onclick="minusPoint('${id}',2)">−1 ${esc(B.name)}</button></div>
      <div class="btns" style="margin-top:8px;justify-content:center"><button class="btn red sm" onclick="if(confirm('Stop live scoring and go back to not started? Points of the current game are cleared.'))stopLive('${id}')">⏹ Stop</button></div>`;
    }else{
      const cur=f.rules||T.scoring;
      body+=`<label>Scoring for this match</label><div class="chips">${PRESETS.map(p=>`<span class="chip ${JSON.stringify(p.r)===JSON.stringify(cur)?'on':''}" onclick="setRules('${id}','${p.k}')">${p.l}</span>`).join('')}</div>
      <div class="grid3" style="margin-top:8px;align-items:end"><div><label>Points</label><input type="number" value="${cur.target}" onchange="setRules('${id}',null,{target:+this.value})"></div>
      <div><label>Games</label><select onchange="setRules('${id}',null,{bestOf:+this.value})">${[1,3].map(n=>`<option value="${n}" ${cur.bestOf===n?'selected':''}>${n===1?'1 game':'Best of 3'}</option>`).join('')}</select></div>
      <div><label><input type="checkbox" style="width:auto" ${cur.deuce?'checked':''} onchange="setRules('${id}',null,{deuce:this.checked})"> Deuce</label><div class="muted" style="font-size:11px">win by 2, max ${cur.cap}</div></div></div>
      <div class="btns" style="margin-top:14px"><button class="btn" style="flex:1;padding:16px" onclick="startLive('${id}')">${r.done?'↺ Re-score live':'▶ Start live scoring'}</button></div>
      <details style="margin-top:12px"><summary class="muted" style="cursor:pointer">📝 Enter final score / walkover / time &amp; court</summary>
      <div class="grid2"><div><label>Time</label><input id="fxTime" value="${esc(f.time)}" placeholder="8:30 PM"></div><div><label>Court</label><input id="fxCourt" value="${esc(f.court)}"></div></div>
      ${[0,1,2].map(i=>{const g=(f.games||[])[i]||['',''];return `<div class="grid3" style="margin-top:6px;align-items:center"><span class="muted">Game ${i+1}</span><input type="number" inputmode="numeric" id="g${i}a" value="${g[0]}"><input type="number" inputmode="numeric" id="g${i}b" value="${g[1]}"></div>`}).join('')}
      <label>Walkover</label><select id="fxWo"><option value="">None</option><option value="t1" ${f.wo==='t1'?'selected':''}>${esc(A.name)} wins</option><option value="t2" ${f.wo==='t2'?'selected':''}>${esc(B.name)} wins</option></select>
      <div class="btns" style="margin-top:10px"><button class="btn" onclick="saveManual('${id}')">💾 Save</button><button class="btn sec" onclick="clearResult('${id}')">Clear result</button><button class="btn red" onclick="delFixture('${id}')">🗑 Delete match</button></div></details>`;
    }
  }else if(r.live)body+=`<div class="muted" style="text-align:center;margin-top:12px">🔄 Updating live…</div>`;
  if(refresh&&$('#modalRoot .sheet'))$('#modalRoot .sheet').innerHTML=body;else modal(body);
  window._openFx=id;$('#modalRoot .sheet').dataset.fx=id;
  const ov=$('#modalRoot .modal');if(ov)ov.onclick=e=>{if(e.target===ov)closeFixture()};
}
function closeFixture(){window._openFx=null;closeModal();render()}
const FX=id=>TT().fixtures.find(x=>x.id===id);
const undoSt={};
function pushUndo(f){(undoSt[f.id]=undoSt[f.id]||[]).push(JSON.stringify({games:f.games,live:f.live,status:f.status}));if(undoSt[f.id].length>60)undoSt[f.id].shift()}
function addPoint(id,n){
  const f=FX(id),T=TT(),R=rulesOf(f,T);if(f.status!=='live')return;pushUndo(f);
  f.live=f.live||{a:0,b:0};n===1?f.live.a++:f.live.b++;
  const w=gameWinner(f.live.a,f.live.b,R);
  if(w){f.games=[...(f.games||[]),[f.live.a,f.live.b]];const r=fxResult({...f,status:'done'}),need=Math.ceil(R.bestOf/2);
    const won=Math.max(r.a,r.b);
    if(won>=need){f.status='done';f.live=null;toast(`🏆 Match won by ${tTeam(T,w===1?f.t1:f.t2).name}`)}
    else{f.live={a:0,b:0};toast(`Game ${f.games.length} → ${tTeam(T,w===1?f.t1:f.t2).name}`)}}
  if(navigator.vibrate)navigator.vibrate(25);
  sendFixture(f);openFixture(id,true);
}
function minusPoint(id,n){const f=FX(id);if(!f.live)return;pushUndo(f);if(n===1&&f.live.a>0)f.live.a--;if(n===2&&f.live.b>0)f.live.b--;sendFixture(f);openFixture(id,true)}
function undoPoint(id){const f=FX(id),s=(undoSt[id]||[]).pop();if(!s)return toast('Nothing to undo');Object.assign(f,JSON.parse(s));sendFixture(f);openFixture(id,true)}
function setRules(id,k,patch){const f=FX(id),T=TT();const base=k?PRESETS.find(p=>p.k===k).r:{...(f.rules||T.scoring),...patch};f.rules={...DEF_RULES,...base};sendFixture(f);openFixture(id,true)}
function startLive(id){const f=FX(id);if(f.status==='done'&&!confirm('This match already has a result. Clear it and score again live?'))return;
  f.rules=f.rules||{...TT().scoring};f.status='live';f.games=[];f.wo='';f.live={a:0,b:0};undoSt[id]=[];sendFixture(f);openFixture(id,true)}
function stopLive(id){const f=FX(id);f.status='scheduled';f.live=null;f.games=[];sendFixture(f);openFixture(id,true)}
function saveManual(id){const f=FX(id);const games=[0,1,2].map(i=>[$('#g'+i+'a').value,$('#g'+i+'b').value]).filter(g=>g[0]!==''&&g[1]!=='').map(g=>[+g[0],+g[1]]);
  f.time=$('#fxTime').value;f.court=$('#fxCourt').value;f.wo=$('#fxWo').value;f.games=games;f.live=null;
  f.status=f.wo||games.length?'done':'scheduled';
  if(f.status==='done'&&!f.wo&&!fxResult(f).w)return toast('Games are level — enter the deciding game');
  sendFixture(f);toast('Saved');openFixture(id,true)}
function clearResult(id){if(!confirm('Clear the result of this match?'))return;const f=FX(id);f.games=[];f.wo='';f.live=null;f.status='scheduled';sendFixture(f);openFixture(id,true)}
function delFixture(id){if(!confirm('Delete this match?'))return;const T=TT();T.fixtures=T.fixtures.filter(x=>x.id!==id);window._openFx=null;closeModal();render();tourOp('delFixture',{id})}

  if(S.olead)t+=(S.complete?'🏆 Overall winner: ':'📈 Leading: ')+S.olead.c.name+'\n';
  S.cats.forEach(k=>{t+=`\n*${k.cat}*${k.lead?(k.complete?' — 🥇 '+k.lead.c.name+(k.tb?' (tie-break)':''):' — leading: '+k.lead.c.name):''}\n`;
    k.fx.forEach(f=>{const r=fxResult(f),A=tTeam(T,f.t1),B=tTeam(T,f.t2);
      t+=`${r.w==='t1'?'✅ ':''}${A.name}${tPlayers(A)?' ('+tPlayers(A)+')':''} vs ${r.w==='t2'?'✅ ':''}${B.name}${tPlayers(B)?' ('+tPlayers(B)+')':''}${r.done?' → '+scoreTxt(f):r.live?' → 🔴 LIVE '+liveTxt(f):f.time?' · 🕒 '+f.time:''}\n`})});

}

const ym=d=>d.slice(0,7);
const monthName=m=>new Date(m+'-15T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function monthsList(){const s=new Set([ym(today())]);D.sessions.forEach(x=>s.add(ym(x.date)));D.payments.forEach(x=>s.add(ym(x.date)));return [...s].sort().reverse()}
function monthReport(m){
  const c0=compute(m+'-00'),c1=compute(m+'-32');
  const sess=D.sessions.filter(s=>ym(s.date)===m);
  const rows=D.players.map(p=>{const a=c0.st[p.id],b=c1.st[p.id];
    return {p,open:a.bal,days:b.played-a.played,fee:b.fees-a.fees,paid:(b.paid-a.paid)+(b.spent-a.spent)-(b.received-a.received),bal:b.bal}})
    .filter(r=>r.p.id===D.adminId||r.p.active||Math.abs(r.open)>0.001||r.days||Math.abs(r.paid)>0.001||Math.abs(r.bal)>0.001).sort((x,y)=>x.p.sn-y.p.sn);
  const a=c0.st[D.adminId]||{bal:0,played:0,fees:0,spent:0,received:0,paid:0},b=c1.st[D.adminId]||a;
  const admin={p:P(D.adminId),open:a.bal,days:b.played-a.played,fee:b.fees-a.fees,spent:b.spent-a.spent,collected:(b.received-a.received)-(b.paid-a.paid),bal:b.bal};
  const tot=rows.reduce((t,r)=>({open:t.open+r.open,days:t.days+r.days,fee:t.fee+r.fee,paid:t.paid+r.paid,bal:t.bal+r.bal}),{open:0,days:0,fee:0,paid:0,bal:0});
  const lastDate=sess.length?sess.map(s=>s.date).sort().pop():'';
  return {m,rows,admin,tot,sessions:sess.length,lastDate,fund:c1.fund,pending:c1.pending,
    due:rows.filter(r=>r.p.id!==D.adminId).reduce((t,r)=>t+Math.min(0,r.bal),0),adv:rows.filter(r=>r.p.id!==D.adminId).reduce((t,r)=>t+Math.max(0,r.bal),0)};
}

function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
function exportCSV(){const c=compute();dl('team-cholesterol-balances.csv',csv([['S.N','Name','Role','Opening','Sessions','Fee charged','Paid','Court paid for team','Collected','Balance','Status'],...[...D.players].sort((a,b)=>a.sn-b.sn).map(p=>{const s=c.st[p.id];return[p.sn,p.name,p.role,p.opening,s.played,s.fees,s.paid,s.spent,s.received,s.bal,p.id===D.adminId?adminTxt(s.bal):statusTxt(s.bal).replace(/^\S+\s/,'')]})]),'text/csv')}
function exportLedgerCSV(){const ss=[...D.sessions].sort((a,b)=>a.date<b.date?-1:1);const ps=[...D.players].sort((a,b)=>a.sn-b.sn);
  const rows=[['Date','Fee','Court','Shuttle','Paid by','Court paid on',...ps.map(p=>p.name+' played'),...ps.map(p=>p.name+' paid')]];
  ss.forEach(s=>rows.push([s.date,s.fee,s.court,s.shuttle,pname(s.paidBy),s.courtPaidOn,...ps.map(p=>s.attendance.includes(p.id)?1:''),...ps.map(p=>{const v=D.payments.filter(x=>x.date===s.date&&x.playerId===p.id).reduce((a,x)=>a+ +x.amount,0);return v||''})]));
  dl('team-cholesterol-sessions.csv',csv(rows),'text/csv')}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.players||!d.sessions)return toast('Not a Team Cholesterol file');if(confirm('Replace all data with this file?')){D=d;commit('Import backup')}})}

/* ---------- MODAL ---------- */
function modal(h){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';window._openFx=null}

/* ---------- STORAGE & GOOGLE SHEET SYNC ---------- */
function saveLocal(){localStorage.setItem(LS_DATA,JSON.stringify(D));localStorage.setItem(LS_DIRTY,dirty?'1':'0');localStorage.setItem(LS_STAMP,serverStamp||'')}
function commit(msg){D.updatedAt=new Date().toISOString();dirty=true;saveLocal();render();if(isAdmin())push(msg);else toast('Saved on this device')}
let syncState='';
function updBadge(){const dot=$('#syncDot'),t=$('#syncTxt');dot.className='dot';
  if(syncing||(typeof inflight!=='undefined'&&inflight)){dot.classList.add('warn');t.textContent='Syncing…';return}
  if(!apiUrl()){dot.classList.add('warn');t.textContent='Not connected';return}
  if(syncState==='err'){dot.classList.add('err');t.textContent=isAdmin()&&dirty?'Not synced · tap to retry':'Offline copy · tap to retry';return}
  if(dirty&&isAdmin()){dot.classList.add('warn');t.textContent='Unsynced changes · tap to sync';return}
  t.textContent=(isAdmin()?'Admin · ':role==='scorer'?'Scorer · ':'')+'Updated '+(D?.updatedAt?new Date(D.updatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')}
$('#syncBadge').onclick=()=>{if(isAdmin()&&dirty)push('retry');else pull(true)};
async function api(params,body){
  const u=apiUrl();if(!u)throw new Error('No Google Sheet connected');
  const q=new URLSearchParams({...params,t:Date.now()}).toString();
  const r=body?await fetch(u,{method:'POST',body:JSON.stringify(body)}):await fetch(u+(u.includes('?')?'&':'?')+q,{cache:'no-store'});
  const txt=await r.text();
  try{return JSON.parse(txt)}catch(e){throw new Error(/<html/i.test(txt)?'Web app is not shared with “Anyone” — redeploy the script':'Unexpected reply ('+r.status+')')}
}
async function pull(manual){
  if(!apiUrl()){render();if(manual)toast('Paste the Google Sheet Web app URL first');return}
  syncing=true;updBadge();
  try{
    const j=await api({action:'get',...(adminPin?{pin:adminPin}:{})});
    if(j.error)throw new Error(j.error);
    if(j.empty){syncState='';if(isAdmin()){toast('Google Sheet is empty — uploading your data…');syncing=false;return push('first upload',true)}else if(manual)toast('No data in the Google Sheet yet')}
    else{
      const localT=D&&D.tournaments&&D.tournaments[0];
      if(!('tournaments' in j)){window._oldBackend=true;j.tournaments=(D&&D.tournaments)||[]}else{window._oldBackend=false;window._serverTourCount=j.tournaments.length}
      if(dirty&&isAdmin()&&j.updatedAt!==serverStamp){if(confirm('The Google Sheet has newer data than your unsynced changes. Load the Sheet version? (Cancel keeps yours)')){D=j;dirty=false}}
      else if(!(dirty&&isAdmin()))D=j;
      if(localT&&D.tournaments&&D.tournaments[0]&&D.tournaments[0]!==localT){const srv=D.tournaments[0];D.tournaments=[localT];mergeTour(srv)}
      serverStamp=j.updatedAt;syncState='';saveLocal();if(manual)toast('Loaded latest data');
      if(dirty&&isAdmin()){syncing=false;return push('pending changes')}
    }
  }catch(e){syncState='err';if(manual)toast('Could not load: '+e.message)}
  syncing=false;render();
}
async function push(msg,force){
  if(!isAdmin())return;if(!apiUrl())return toast('Connect the Google Sheet first (More tab)');
  syncing=true;updBadge();
  try{
    let j=await api(null,{pin:adminPin,base:serverStamp,force:!!force,data:D,status:statusRowsForSheet()});
    if(j.conflict){
      if(confirm('Data was changed from another phone. OK = overwrite with YOUR version · Cancel = load the other version')){j=await api(null,{pin:adminPin,force:true,data:D,status:statusRowsForSheet()})}
      else{dirty=false;syncing=false;return pull(true)}
    }
    if(!j.ok)throw new Error(j.error||'save failed');
    serverStamp=j.updatedAt;dirty=false;syncState='';saveLocal();toast('✅ Saved to Google Sheet');
  }catch(e){syncState='err';toast('Not synced: '+e.message+' — kept on this phone, will retry')}
  syncing=false;render();
}
async function login(pin){
  if(!pin)return toast('Enter the PIN');
  try{const j=await api({action:'check',pin});if(!j.ok)return toast('Wrong PIN');
    adminPin=pin;role=j.role||'admin';localStorage.setItem(LS_PIN,pin);localStorage.setItem(LS_ROLE,role);toast(role==='admin'?'🔓 Admin mode':'🏸 Scorer mode — Tourney tab');await pull(false);tab=role==='admin'?'home':'tour';render()}
  catch(e){toast('Could not check PIN: '+e.message)}
}
function logout(){if(dirty&&!confirm('There are unsynced changes on this phone. Log out anyway?'))return;adminPin='';role='';localStorage.removeItem(LS_PIN);localStorage.removeItem(LS_ROLE);dirty=false;saveLocal();render();pull(false)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#menuBtn').onclick=()=>toggleDrawer(!$('#drawer').classList.contains('on'));
window.addEventListener('online',()=>{if(dirty&&isAdmin())push('retry')});
// boot: show cached/seed instantly, then load config + latest data from the Google Sheet
$('#heroLogo').src=LOGO;$('#drawerLogo').src=LOGO;
D=JSON.parse(localStorage.getItem(LS_DATA)||'null')||SEED;render();
(async()=>{try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(r.ok)CFG=await r.json();if(!/^https:\/\/script\.google/.test(CFG.apiUrl||''))CFG.apiUrl=''}catch(e){}pull(false)})();
</script>
