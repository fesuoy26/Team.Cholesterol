<html lang="en">

<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Team Cholesterol</title>

<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#14231c;--muted:#6b7a72;--line:#e2e8e3;--green:#0f3d2e;--green2:#1e6b4a;--gold:#e8b528;--red:#c0392b;--redbg:#fdecea;--ok:#1e7d4a;--okbg:#e6f4ec;--grey:#eef1ef;--adm:#fff4e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Anek Malayalam',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:16px}
.hero{background:linear-gradient(160deg,#0f3d2e,#1e6b4a);color:#fff;padding:18px 16px 54px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.14);border-radius:6px;pointer-events:none}
.hero:after{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:2px solid rgba(255,255,255,.14)}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px;position:relative;z-index:1}
.hero .sub{opacity:.85;font-size:13px;position:relative;z-index:1}
.shuttle{position:absolute;right:18px;top:12px;width:56px;height:56px;animation:fly 4s ease-in-out infinite;z-index:1}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-20deg)}50%{transform:translate(-14px,10px) rotate(10deg)}}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:20px;font-size:12px;position:relative;z-index:1;cursor:pointer;border:0;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#7bd88f}.dot.warn{background:var(--gold)}.dot.err{background:#ff7b7b}
main{padding:0 12px 96px;margin-top:-40px;position:relative;z-index:2;max-width:760px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,61,46,.07)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--grey);border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}.kpi.ok b{color:var(--ok)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn{width:26px;height:26px;border-radius:50%;background:var(--grey);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.pill{padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.due{background:var(--redbg);color:var(--red)}.pill.cr{background:var(--okbg);color:var(--ok)}.pill.cl{background:var(--grey);color:var(--muted)}
.pill.warn{background:#fff3cd;color:#8a6100}.pill.g{background:#e8eefc;color:#2f55a4}
.adminbox{background:var(--adm);border:1px dashed #f0b36a}
.muted{color:var(--muted);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:20px}.tabs button.on{color:var(--green);font-weight:700}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--green);color:#fff;cursor:pointer}
.btn.sec{background:var(--grey);color:var(--ink)}.btn.gold{background:var(--gold);color:#3b2b00}.btn.red{background:var(--redbg);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:78px;z-index:21;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,25,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--grey);width:34px;height:34px;border-radius:50%;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafcfa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.q{padding:4px 9px;font-size:13px}
.payrow{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.payrow .q{grid-column:1/3;display:flex;gap:5px;flex-wrap:wrap}
.payrow input{padding:8px;text-align:right;font-weight:700}
.seg{display:flex;background:var(--grey);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px}.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;font-size:14px}table.mt{font-size:12.5px;table-layout:fixed}table.mt td,table.mt th{padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}table.mt col.c1{width:22px}table.mt col.c3,table.mt col.c5,table.mt col.c6{width:44px}table.mt col.c4{width:34px}table.mt col.c7{width:52px}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted)}td.n,th.n{text-align:right}
.month{font-size:13px;font-weight:800;color:var(--green2);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.score{font-weight:800;font-size:15px}.win{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14231c;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%}
.help li{margin-bottom:6px;font-size:14px}
.search{margin-bottom:8px}
</style>
</head>

const P=id=>D.players.find(p=>p.id===id);

const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};

/* ---------- ACCOUNTING ----------
 balance(p) = opening + cash p paid + court/shuttle p paid for the team - cash p received from others - fee for every session p played
 Minus = owes the team, Plus = team owes him. Admin: Plus = spent extra, Minus = holding team cash.
 Team fund = opening fund + fees charged - court/shuttle cost.  Check: sum(balances)+fund+pending court = 0 */
function compute(asOf){
  asOf=asOf||'9999-12-31';
  const st={};D.players.forEach(p=>st[p.id]={bal:+p.opening||0,played:0,fees:0,paid:0,spent:0,received:0});
  let fees=0,cost=0,pending=0,pendingList=[];
  D.sessions.filter(s=>s.date<=asOf).forEach(s=>{
    s.attendance.forEach(id=>{if(!st[id])return;st[id].bal-=+s.fee;st[id].played++;st[id].fees+=+s.fee;fees+=+s.fee});
    const ex=(+s.court||0)+(+s.shuttle||0);cost+=ex;
    if(s.courtPaidOn&&s.courtPaidOn<=asOf&&s.paidBy&&st[s.paidBy]){st[s.paidBy].bal+=ex;st[s.paidBy].spent+=ex}
    else if(ex){pending+=ex;pendingList.push(s)}
  });
  D.payments.filter(x=>x.date<=asOf).forEach(x=>{
    const a=+x.amount||0;if(st[x.playerId]){st[x.playerId].bal+=a;st[x.playerId].paid+=a}
    const r=x.receivedBy||D.adminId;if(st[r]){st[r].bal-=a;st[r].received+=a}
  });
  const fund=(+D.openingFund||0)+fees-cost;
  const sum=Object.values(st).reduce((a,b)=>a+b.bal,0);
  return {st,fund,pending,pendingList,fees,cost,check:Math.round((sum+fund+pending)*100)/100};
}
function ledger(id){
  const p=P(id);const rows=[];
  D.sessions.forEach(s=>{
    if(s.attendance.includes(id))rows.push({d:s.date,t:`Played · fee`,a:-s.fee});
    const ex=(+s.court||0)+(+s.shuttle||0);
    if(s.paidBy===id&&s.courtPaidOn&&ex)rows.push({d:s.courtPaidOn,t:`Paid court/shuttle for ${fd(s.date,{day:'numeric',month:'short'})}`,a:ex});
  });
  D.payments.forEach(x=>{
    if(x.playerId===id)rows.push({d:x.date,t:'Paid'+(x.note?` · ${x.note}`:''),a:+x.amount});
    if((x.receivedBy||D.adminId)===id&&x.playerId!==id)rows.push({d:x.date,t:`Collected from ${pname(x.playerId)}`,a:-x.amount});
  });
  rows.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.a<0?-1:1));
  let b=+p.opening||0;rows.forEach(r=>{b+=r.a;r.b=b});
  return rows;
}

function waText(){
  const c=compute(),last=sortedSessions()[0];
  const ms=D.players.filter(p=>p.id!==D.adminId&&(p.active||Math.abs(c.st[p.id].bal)>0.001)).sort((a,b)=>a.sn-b.sn);
  const due=ms.reduce((a,p)=>a+Math.min(0,c.st[p.id].bal),0),cr=ms.reduce((a,p)=>a+Math.max(0,c.st[p.id].bal),0);
  let t=`🏸 *TEAM CHOLESTEROL — Account Status*\n`;
  if(last)t+=`📅 ${fd(last.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}\n👥 Players: ${last.attendance.length} | 💵 Fee: ${last.fee} | 💰 Collected: ${money(collectedOn(last.date))}\n`;
  t+=`\n`+ms.map(p=>`${p.sn}. ${p.name} → ${statusTxt(c.st[p.id].bal)}`).join('\n');
  t+=`\n\n🔴 To collect: ${money(-due)} | 🟢 Advance: ${money(cr)}\n🧾 Admin: ${adminTxt(c.st[D.adminId]?.bal||0)} | 🏦 Fund: ${money(c.fund)}`;
  if(c.pending)t+=`\n⏳ Court fee pending: ${money(c.pending)}`;
  t+=`\n\n🔴 Minus = court fee to pay · 🟢 Plus = paid extra`;
  if(/^https?:/.test(location.href))t+=`\n🔗 ${location.origin+location.pathname}`;
  return t;
}

    <span class="pill cl">💰 ${money(collectedOn(s.date))}</span></div>`});

/* ---------- SESSION EDITOR ---------- */
function editSession(id){
  const s=id?JSON.parse(JSON.stringify(D.sessions.find(x=>x.id===id))):{id:uid('s'),date:today(),fee:(sortedSessions()[0]||{}).fee||15,court:80,shuttle:0,paidBy:D.adminId,courtPaidOn:today(),attendance:[],note:''};
  const existing={};D.payments.filter(x=>x.sessionId===s.id).forEach(x=>existing[x.playerId]=x);
  window._S={s,orig:Object.fromEntries(Object.entries(existing).map(([k,v])=>[k,v.amount])),pay:Object.fromEntries(Object.entries(existing).map(([k,v])=>[k,{amount:v.amount,note:v.note||'',id:v.id}])),isNew:!id};
  const cstat=s.courtPaidOn?(s.courtPaidOn===s.date?'same':'later'):'pending';window._S.cstat=cstat;
  drawSession();
}

  const {s,pay,cstat}=window._S;const c=compute();
  const act=D.players.filter(p=>p.active||s.attendance.includes(p.id)).sort((a,b)=>a.sn-b.sn);
  const payList=act.filter(p=>p.id!==D.adminId&&(s.attendance.includes(p.id)||pay[p.id]));
  modal(`<h3>${window._S.isNew?'＋ New session':'✏️ Edit session'}<button class="x" onclick="closeModal()">✕</button></h3>
  <div class="grid2"><div><label>Date</label><input type="date" value="${s.date}" onchange="_S.s.date=this.value;if(_S.cstat==='same')_S.s.courtPaidOn=this.value"></div>
  <div><label>Fee per player</label><input type="number" inputmode="decimal" value="${s.fee}" oninput="_S.s.fee=+this.value"></div></div>
  <div class="chips" style="margin-top:6px">${[10,15,20,25].map(v=>`<span class="chip q ${+s.fee===v?'on':''}" onclick="_S.s.fee=${v};drawSession()">${v}</span>`).join('')}</div>
  <div class="grid2"><div><label>Court fee</label><input type="number" inputmode="decimal" value="${s.court}" oninput="_S.s.court=+this.value"></div>
  <div><label>Shuttle / other</label><input type="number" inputmode="decimal" value="${s.shuttle||0}" oninput="_S.s.shuttle=+this.value"></div></div>
  <label>Court paid?</label>
  <div class="seg"><button class="${cstat==='same'?'on':''}" onclick="_S.cstat='same';_S.s.courtPaidOn=_S.s.date;drawSession()">✅ Paid today</button><button class="${cstat==='later'?'on':''}" onclick="_S.cstat='later';if(!_S.s.courtPaidOn||_S.s.courtPaidOn===_S.s.date)_S.s.courtPaidOn=today();drawSession()">📆 Paid later</button><button class="${cstat==='pending'?'on':''}" onclick="_S.cstat='pending';_S.s.courtPaidOn='';drawSession()">⏳ Not yet</button></div>
  <div class="grid2">${cstat!=='pending'?`<div><label>Paid by</label><select onchange="_S.s.paidBy=this.value">${D.players.map(p=>`<option value="${p.id}" ${p.id===s.paidBy?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`:'<div class="muted" style="padding-top:30px">Players are still charged. Mark it paid when the court is settled.</div>'}
  ${cstat==='later'?`<div><label>Paid on</label><input type="date" value="${s.courtPaidOn}" onchange="_S.s.courtPaidOn=this.value"></div>`:''}</div>
  <label>👥 Who played? (${s.attendance.length}) — tap to select</label>
  <div class="chips">${act.map(p=>`<span class="chip ${s.attendance.includes(p.id)?'on':''}" onclick="togAtt('${p.id}')">${esc(p.name)}</span>`).join('')}
  <span class="chip" style="border-style:dashed" onclick="quickGuest()">＋ Guest / new player</span></div>
  <label style="margin-top:14px">💵 Cash received today <span style="font-weight:400">(blank = not paid · part payment OK · include old dues)</span></label>
  ${payList.map(p=>{const v=pay[p.id]?.amount??'';const bal=c.st[p.id].bal;return `<div class="payrow"><div><b>${esc(p.name)}</b>${s.attendance.includes(p.id)?'':' <span class="muted">(not playing)</span>'}<div class="muted">Balance now ${money(bal)}</div></div>

function togAtt(id){const a=_S.s.attendance;const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);drawSession()}
function setPay(id,v,redraw){if(v===''||v===null){delete _S.pay[id]}else{_S.pay[id]=_S.pay[id]||{note:''};_S.pay[id].amount=+v}if(redraw)drawSession()}
function setNote(id,v){_S.pay[id]=_S.pay[id]||{amount:0};_S.pay[id].note=v}
function addPayer(){const opts=D.players.filter(p=>p.id!==D.adminId&&!_S.s.attendance.includes(p.id)&&!_S.pay[p.id]);
  const n=prompt('Who paid? Type the S.N:\n'+opts.map(p=>p.sn+'. '+p.name).join('\n'));const p=opts.find(x=>String(x.sn)===String(n).trim());if(p){_S.pay[p.id]={amount:'',note:'Paid without playing'};drawSession()}}
function quickGuest(){const n=prompt('Name of guest / new player:');if(!n)return;const g=confirm('Is this a GUEST? (OK = guest, Cancel = regular member)');
  const p={id:uid('p'),sn:Math.max(0,...D.players.map(x=>x.sn))+1,name:n.trim().toUpperCase(),role:g?'guest':'member',phone:'',opening:0,active:true};D.players.push(p);_S.s.attendance.push(p.id);drawSession()}
function saveSession(){
  const {s,pay}=_S;if(!s.date)return toast('Enter the date');
  if(_S.cstat==='same')s.courtPaidOn=s.date;if(_S.cstat==='pending')s.courtPaidOn='';
  if(D.sessions.some(x=>x.date===s.date&&x.id!==s.id)&&!confirm('A session already exists on this date. Save another one?'))return;
  const i=D.sessions.findIndex(x=>x.id===s.id);i<0?D.sessions.push(s):D.sessions[i]=s;
  D.payments=D.payments.filter(x=>x.sessionId!==s.id);
  Object.entries(pay).forEach(([pid,v])=>{if(v.amount!==''&&+v.amount!==0)D.payments.push({id:v.id||uid('y'),date:s.date,playerId:pid,amount:+v.amount,receivedBy:D.adminId,sessionId:s.id,note:v.note||''})});
  closeModal();commit(`Session ${s.date}`);
}
function delSession(id){if(!confirm('Delete this session and its payments?'))return;D.sessions=D.sessions.filter(x=>x.id!==id);D.payments=D.payments.filter(x=>x.sessionId!==id);closeModal();commit('Delete session')}

function weekStart(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-x.getDay());return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')} // week starts Sunday (KSA)
function matchResult(m){let a=0,b=0,pa=0,pb=0;m.games.forEach(g=>{if(g[0]===''||g[1]==='')return;pa+=+g[0];pb+=+g[1];+g[0]>+g[1]?a++:+g[1]>+g[0]?b++:0});return{a,b,pa,pb,w:a>b?'a':b>a?'b':''}}
function vMatches(){
  const tbl={};D.matches.forEach(m=>{const r=matchResult(m);[['a',m.a],['b',m.b]].forEach(([side,ids])=>ids.forEach(id=>{const t=tbl[id]=tbl[id]||{p:0,w:0,diff:0};t.p++;if(r.w===side)t.w++;t.diff+=side==='a'?r.pa-r.pb:r.pb-r.pa}))});
  const lb=Object.entries(tbl).sort((x,y)=>y[1].w-x[1].w||(y[1].w/y[1].p)-(x[1].w/x[1].p)||y[1].diff-x[1].diff);
  const ms=[...D.matches].sort((a,b)=>a.date<b.date?1:-1);let html='',wk='';
  html+=`<div class="card"><h2>🏆 Leaderboard</h2>${lb.length?`<table><tr><th>#</th><th>Player</th><th class="n">P</th><th class="n">W</th><th class="n">Win%</th><th class="n">+/-</th></tr>${lb.map(([id,t],i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(pname(id))}</td><td class="n">${t.p}</td><td class="n"><b>${t.w}</b></td><td class="n">${Math.round(t.w/t.p*100)}%</td><td class="n">${t.diff>0?'+':''}${t.diff}</td></tr>`).join('')}</table>`:'<div class="muted">No matches recorded yet.'+(isAdmin()?' Tap ＋ Match to add the first one.':'')+'</div>'}</div><div class="card">`;
  ms.forEach(m=>{const w=weekStart(m.date);if(w!==wk){html+=`<div class="month">Week of ${fd(w,{day:'numeric',month:'short'})}</div>`;wk=w}
    const r=matchResult(m);
    html+=`<div class="row" ${isAdmin()?`onclick="editMatch('${m.id}')"`:''}><div style="flex:1"><div class="${r.w==='a'?'win':''}"><b>${m.a.map(pname).map(esc).join(' & ')}</b></div><div class="${r.w==='b'?'win':''}"><b>${m.b.map(pname).map(esc).join(' & ')}</b></div><div class="muted">${fd(m.date)} · ${m.format}${m.note?' · '+esc(m.note):''}</div></div>
    <div class="score">${m.games.filter(g=>g[0]!=='').map(g=>`${g[0]}-${g[1]}`).join('<br>')}</div></div>`});
  $('#view').innerHTML=html+(ms.length?'':'')+'</div>';
}
function editMatch(id){

const ym=d=>d.slice(0,7);
const monthName=m=>new Date(m+'-15T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function monthsList(){const s=new Set([ym(today())]);D.sessions.forEach(x=>s.add(ym(x.date)));D.payments.forEach(x=>s.add(ym(x.date)));return [...s].sort().reverse()}
function monthReport(m){
  const c0=compute(m+'-00'),c1=compute(m+'-32');
  const sess=D.sessions.filter(s=>ym(s.date)===m);
  const rows=D.players.filter(p=>p.id!==D.adminId).map(p=>{const a=c0.st[p.id],b=c1.st[p.id];
    return {p,open:a.bal,days:b.played-a.played,fee:b.fees-a.fees,paid:(b.paid-a.paid)+(b.spent-a.spent)-(b.received-a.received),bal:b.bal}})
    .filter(r=>r.p.active||Math.abs(r.open)>0.001||r.days||Math.abs(r.paid)>0.001||Math.abs(r.bal)>0.001).sort((x,y)=>x.p.sn-y.p.sn);
  const a=c0.st[D.adminId]||{bal:0,played:0,fees:0,spent:0,received:0,paid:0},b=c1.st[D.adminId]||a;
  const admin={p:P(D.adminId),open:a.bal,days:b.played-a.played,fee:b.fees-a.fees,spent:b.spent-a.spent,collected:(b.received-a.received)-(b.paid-a.paid),bal:b.bal};
  const tot=rows.reduce((t,r)=>({open:t.open+r.open,days:t.days+r.days,fee:t.fee+r.fee,paid:t.paid+r.paid,bal:t.bal+r.bal}),{open:0,days:0,fee:0,paid:0,bal:0});
  const lastDate=sess.length?sess.map(s=>s.date).sort().pop():'';
  return {m,rows,admin,tot,sessions:sess.length,lastDate,fund:c1.fund,pending:c1.pending,
    due:rows.reduce((t,r)=>t+Math.min(0,r.bal),0),adv:rows.reduce((t,r)=>t+Math.max(0,r.bal),0)};
}

  const url=URL.createObjectURL(blob);
  modal(`<h3>📸 ${monthName(m)}<button class="x" onclick="closeModal()">✕</button></h3><img src="${url}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
  <div class="btns" style="margin-top:12px"><button class="btn" id="shBtn">📲 Share to WhatsApp</button><a class="btn sec" style="text-decoration:none" href="${url}" download="${name}">⬇️ Download</a></div>
  <div class="muted" style="margin-top:6px">If sharing doesn't open, tap Download (or long-press the image → Save) and send it in the group.</div>`);
  $('#shBtn').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Team Cholesterol — '+monthName(m)});else{const a=document.createElement('a');a.href=url;a.download=name;a.click();toast('Image downloaded — send it in WhatsApp')}}catch(e){}};
}

/* ---------- SETTINGS ---------- */
function vSettings(){
  const c=compute();
  $('#view').innerHTML=`
  <div class="card"><h2>🔐 Admin <span class="pill ${isAdmin()?'cr':'cl'}">${isAdmin()?'Admin mode':'View only'}</span></h2>
   ${isAdmin()?`<div class="muted">You can add and edit. Every save goes to the Google Sheet.</div>
   <div class="btns" style="margin-top:10px"><button class="btn sec" onclick="push('manual')">⬆️ Sync now</button><button class="btn sec" onclick="if(confirm('Upload ALL data on this phone to the Google Sheet (overwrites the Sheet)?'))push('upload all',true)">⬆️ Upload all data</button><button class="btn red" onclick="logout()">Log out</button></div>`
   :`<div class="muted">Members only view. The admin enters the PIN to add or edit.</div>
   <label>Admin PIN</label><input id="pinIn" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN">
   <div class="btns" style="margin-top:10px"><button class="btn" onclick="login($('#pinIn').value.trim())">🔓 Log in</button></div>`}</div>
  <div class="card"><h2>🔗 Data connection</h2>
   <div class="muted">${apiUrl()?'Connected to Google Sheet ✅':'Not connected yet — paste the Web app URL from Google Apps Script (see setup guide).'}</div>
   ${isAdmin()||!CFG.apiUrl?`<label>Google Apps Script Web app URL</label><input id="apiIn" value="${esc(localStorage.getItem(LS_API)||CFG.apiUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:13px">
   <div class="btns" style="margin-top:10px"><button class="btn sec" onclick="localStorage.setItem(LS_API,$('#apiIn').value.trim());pull(true)">💾 Save URL</button><button class="btn sec" onclick="pull(true)">🔄 Reload data</button></div>`:`<div class="btns" style="margin-top:10px"><button class="btn sec" onclick="pull(true)">🔄 Reload data</button></div>`}</div>
  ${isAdmin()?`<div class="card"><h2>🏦 Opening values</h2><div class="grid2"><div><label>Opening team fund</label><input type="number" value="${D.openingFund}" onchange="D.openingFund=+this.value;commit('Opening fund')"></div><div><label>Records start</label><input type="date" value="${D.openingDate||''}" onchange="D.openingDate=this.value;commit('Opening date')"></div></div>
   <div class="muted">Opening balances per player are set in Players → Edit.</div></div>`:''}
  <div class="card"><h2>📖 How the account works</h2><ul class="help">
   <li><b>Played</b> → that day's fee is charged, even if nothing is paid. Paying later, part-paying or paying several days at once is fine — the balance carries forward.</li>
   <li><b>Part payment / no change</b> → enter the cash actually received. If someone gives 100 for a 15 fee and no change is returned, the extra stays as their 🟢 credit. When change is given back later, record “Change / refund given back”.</li>
   <li><b>Paid but didn't play</b> → enter the payment only. Nothing is charged.</li>
   <li><b>Court paid later</b> (e.g. 4 Nov: admin absent, paid on 5 Nov) → mark the session “Paid later” with the date. Players are still charged on the playing day. ⏳ shows while unpaid.</li>
   <li><b>Sign rule</b> → Minus = has to pay · Plus = paid extra. Admin: Plus = spent extra from pocket · Minus = holding team cash.</li>
   <li><b>Team fund</b> = fees charged above the real court + shuttle cost. Balances + fund + pending court always add to zero ${c.check===0?'✅':'⚠ (off by '+money(c.check)+')'}.</li></ul></div>
  <div class="card"><h2>💾 Backup</h2><div class="btns"><button class="btn sec" onclick="dl('team-cholesterol-data.json',JSON.stringify(D,null,1),'application/json')">⬇️ JSON backup</button><button class="btn sec" onclick="exportCSV()">⬇️ Balances CSV</button><button class="btn sec" onclick="exportLedgerCSV()">⬇️ Session register CSV</button>${isAdmin()?`<label class="btn sec" style="margin:0;color:var(--ink)">⬆️ Import JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label>`:''}</div></div>
  <div class="muted" style="text-align:center;margin:20px 0">Team Cholesterol · Riyadh</div>`;
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
function exportCSV(){const c=compute();dl('team-cholesterol-balances.csv',csv([['S.N','Name','Role','Opening','Sessions','Fee charged','Paid','Court paid for team','Collected','Balance','Status'],...[...D.players].sort((a,b)=>a.sn-b.sn).map(p=>{const s=c.st[p.id];return[p.sn,p.name,p.role,p.opening,s.played,s.fees,s.paid,s.spent,s.received,s.bal,p.id===D.adminId?adminTxt(s.bal):statusTxt(s.bal).replace(/^\S+\s/,'')]})]),'text/csv')}
function exportLedgerCSV(){const ss=[...D.sessions].sort((a,b)=>a.date<b.date?-1:1);const ps=[...D.players].sort((a,b)=>a.sn-b.sn);
  const rows=[['Date','Fee','Court','Shuttle','Paid by','Court paid on',...ps.map(p=>p.name+' played'),...ps.map(p=>p.name+' paid')]];
  ss.forEach(s=>rows.push([s.date,s.fee,s.court,s.shuttle,pname(s.paidBy),s.courtPaidOn,...ps.map(p=>s.attendance.includes(p.id)?1:''),...ps.map(p=>{const v=D.payments.filter(x=>x.date===s.date&&x.playerId===p.id).reduce((a,x)=>a+ +x.amount,0);return v||''})]));
  dl('team-cholesterol-sessions.csv',csv(rows),'text/csv')}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.players||!d.sessions)return toast('Not a Team Cholesterol file');if(confirm('Replace all data with this file?')){D=d;commit('Import backup')}})}

/* ---------- MODAL ---------- */
function modal(h){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow=''}

/* ---------- STORAGE & GOOGLE SHEET SYNC ---------- */
function saveLocal(){localStorage.setItem(LS_DATA,JSON.stringify(D));localStorage.setItem(LS_DIRTY,dirty?'1':'0');localStorage.setItem(LS_STAMP,serverStamp||'')}
function commit(msg){D.updatedAt=new Date().toISOString();dirty=true;saveLocal();render();if(isAdmin())push(msg);else toast('Saved on this device')}
let syncState='';
function updBadge(){const dot=$('#syncDot'),t=$('#syncTxt');dot.className='dot';
  if(syncing){dot.classList.add('warn');t.textContent='Syncing…';return}
  if(!apiUrl()){dot.classList.add('warn');t.textContent='Not connected';return}
  if(syncState==='err'){dot.classList.add('err');t.textContent=isAdmin()&&dirty?'Not synced · tap to retry':'Offline copy · tap to retry';return}
  if(dirty&&isAdmin()){dot.classList.add('warn');t.textContent='Unsynced changes · tap to sync';return}
  t.textContent=(isAdmin()?'Admin · ':'')+'Updated '+(D?.updatedAt?new Date(D.updatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')}
$('#syncBadge').onclick=()=>{if(isAdmin()&&dirty)push('retry');else pull(true)};
async function api(params,body){
  const u=apiUrl();if(!u)throw new Error('No Google Sheet connected');
  const q=new URLSearchParams({...params,t:Date.now()}).toString();
  const r=body?await fetch(u,{method:'POST',body:JSON.stringify(body)}):await fetch(u+(u.includes('?')?'&':'?')+q,{cache:'no-store'});
  const txt=await r.text();
  try{return JSON.parse(txt)}catch(e){throw new Error(/<html/i.test(txt)?'Web app is not shared with “Anyone” — redeploy the script':'Unexpected reply ('+r.status+')')}
}
async function pull(manual){
  if(!apiUrl()){render();if(manual)toast('Paste the Google Sheet Web app URL first');return}
  syncing=true;updBadge();
  try{
    const j=await api({action:'get',...(adminPin?{pin:adminPin}:{})});
    if(j.error)throw new Error(j.error);
    if(j.empty){syncState='';if(isAdmin()){toast('Google Sheet is empty — uploading your data…');syncing=false;return push('first upload',true)}else if(manual)toast('No data in the Google Sheet yet')}
    else{
      if(dirty&&isAdmin()&&j.updatedAt!==serverStamp){if(confirm('The Google Sheet has newer data than your unsynced changes. Load the Sheet version? (Cancel keeps yours)')){D=j;dirty=false}}
      else if(!(dirty&&isAdmin()))D=j;
      serverStamp=j.updatedAt;syncState='';saveLocal();if(manual)toast('Loaded latest data');
      if(dirty&&isAdmin()){syncing=false;return push('pending changes')}
    }
  }catch(e){syncState='err';if(manual)toast('Could not load: '+e.message)}
  syncing=false;render();
}
async function push(msg,force){
  if(!isAdmin())return;if(!apiUrl())return toast('Connect the Google Sheet first (More tab)');
  syncing=true;updBadge();
  try{
    let j=await api(null,{pin:adminPin,base:serverStamp,force:!!force,data:D,status:statusRowsForSheet()});
    if(j.conflict){
      if(confirm('Data was changed from another phone. OK = overwrite with YOUR version · Cancel = load the other version')){j=await api(null,{pin:adminPin,force:true,data:D,status:statusRowsForSheet()})}
      else{dirty=false;syncing=false;return pull(true)}
    }
    if(!j.ok)throw new Error(j.error||'save failed');
    serverStamp=j.updatedAt;dirty=false;syncState='';saveLocal();toast('✅ Saved to Google Sheet');
  }catch(e){syncState='err';toast('Not synced: '+e.message+' — kept on this phone, will retry')}
  syncing=false;render();
}
async function login(pin){
  if(!pin)return toast('Enter the PIN');
  try{const j=await api({action:'check',pin});if(!j.ok)return toast('Wrong PIN');
    adminPin=pin;localStorage.setItem(LS_PIN,pin);toast('🔓 Admin mode');await pull(false);tab='status';render()}
  catch(e){toast('Could not check PIN: '+e.message)}
}
function logout(){if(dirty&&!confirm('There are unsynced changes on this phone. Log out anyway?'))return;adminPin='';localStorage.removeItem(LS_PIN);dirty=false;saveLocal();render();pull(false)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;window.scrollTo(0,0);render()});
window.addEventListener('online',()=>{if(dirty&&isAdmin())push('retry')});
// boot: show cached/seed instantly, then load config + latest data from the Google Sheet
D=JSON.parse(localStorage.getItem(LS_DATA)||'null')||SEED;render();
(async()=>{try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(r.ok)CFG=await r.json();if(!/^https:\/\/script\.google/.test(CFG.apiUrl||''))CFG.apiUrl=''}catch(e){}pull(false)})();
</script>
